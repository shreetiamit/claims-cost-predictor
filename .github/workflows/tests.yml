name: tests

on:
  push:
  pull_request:

# A new push to the same branch cancels the previous run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest

    env:
      # Same cohort as local development and the Render deploy.
      STUDENT_SEED: "3"

    steps:
      - uses: actions/checkout@v4

      # Pinned numpy and scikit-learn have no wheels for 3.13.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # model.joblib is gitignored, so train it first. Otherwise the model,
      # evaluation, fairness and API tests have no model to load.
      - name: Run the test suite
        run: |
          python train.py
          pytest -v
